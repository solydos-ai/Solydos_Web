version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22 --skip-default-packages && nvm use 22
        - npm ci
    build:
      commands:
        - npm run lint
        - npm run build
  artifacts:
    baseDirectory: out
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*